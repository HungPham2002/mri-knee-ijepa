meta:
  model_name: vit_base
  use_bfloat16: true
  load_checkpoint: false
  read_checkpoint: null
  copy_data: false
  pred_depth: 4
  pred_emb_dim: 384
data:
  dataframe_path: '/network-volume/hungph/data/SAG_3D_DESS_v2_full/train.csv'
  root_path: '/network-volume/hungph/data/SAG_3D_DESS_v2_full/MRI_Numpy'
  image_folder: ''
  batch_size: 8        
  pin_mem: true
  num_workers: 128
  crop_size: [120, 160, 160]
  crop_scale: [0.5, 1.0]     # R0 ghi [0.2,1.0] nhưng BỊ BỎ QUA. Giờ dùng thật, cận dưới 0.5
                             # để không crop mất khe khớp (MRI-specific).
  # -- normalization mới --
  normalize: foreground_zscore   # R0=minmax. Đặt 'minmax' để tái tạo R0.
  fg_method: percentile
  p_bg: 20
  use_flip: true
  flip_axis: -1
  use_affine: false
mask:
  allow_overlap: false
  patch_size: [12, 16, 16]
  num_enc_masks: 1
  min_keep: 10
  enc_mask_scale: [0.85, 1.0]
  num_pred_masks: 4
  pred_mask_scale: [0.15, 0.2]
  aspect_ratio: [0.75, 1.5]
  fix_enc_clamp: true        # false -> hành vi R0.
optimization:
  epochs: 300
  ipe_scale: 1.0             # đặt tường minh (tránh nhầm default 1.25 trong init_opt).
  weight_decay: 0.04
  final_weight_decay: 0.1    # R0=0.4. Ramp WD gấp 10 quá gắt với data nhỏ -> hạ.
  lr: 0.0003                 # R0=1e-3 (dành cho batch ~2048). Ở batch 128 hạ peak.
  warmup: 20                 # R0=40 (13% quá dài). Rút ngắn.
  min_lr: 1.0e-06
  start_lr: 2.0e-05          # R0=2e-4. Hạ theo peak.
  final_lr: 1.0e-06
  clip_grad: 3.0
  skip_wd: ['pos_embed', 'mask_token', 'bias']
  # -- EMA & stabilization --
  ema: [0.999, 1.0]          # R0=[0.996,1.0]. Base cao hơn -> target trễ/ổn định hơn.
  var_reg_weight: 0.0        # TẮT. Chỉ bật (vd 1.0) nếu smoke-test vẫn collapse.
logging:
  folder: 'logs/mri_vit_base_R1'
  write_tag: 'mri_vit_base_R1'
